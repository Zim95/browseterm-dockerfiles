[tool.poetry]
name = "reaper"
version = "0.1.0"
description = "Kubernetes CronJob that hibernates idle RUNNING containers (save via container-maker, delete pod, mark HIBERNATED)"
authors = ["Zim95 <shresthanamah@gmail.com>"]
license = "Apache 2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
grpcio = "^1.70.0"
kubernetes = "^32.0.1"
browseterm-db = {git = "https://github.com/Zim95/browseterm-db.git", rev = "main"}
container-maker-spec = {git = "https://github.com/Zim95/container-maker-spec.git", rev = "main"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
