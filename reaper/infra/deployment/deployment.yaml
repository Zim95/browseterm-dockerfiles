# Reaper: ServiceAccount + Role + RoleBinding + CronJob. envsubst-templated (mirror cert-manager).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reaper-service-account
  namespace: ${NAMESPACE}
---
# The reaper only needs to READ the container-maker mTLS cert secret. Pod deletion is delegated
# to container-maker over gRPC, so no pod verbs are required here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reaper-role
  namespace: ${NAMESPACE}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reaper-role-binding
  namespace: ${NAMESPACE}
subjects:
- kind: ServiceAccount
  name: reaper-service-account
  namespace: ${NAMESPACE}
roleRef:
  kind: Role
  name: reaper-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reaper
  namespace: ${NAMESPACE}
spec:
  schedule: "0 * * * *"              # hourly; the idle threshold (1 week) is the real gate
  concurrencyPolicy: Forbid          # never overlap sweeps (a sweep can be slow: save blocks)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 900   # clean finished pods after 15 min
      template:
        spec:
          serviceAccountName: reaper-service-account
          restartPolicy: OnFailure
          containers:
          - name: reaper
            image: ${REPO_NAME}/reaper:latest
            imagePullPolicy: Always
            env:
            - name: NAMESPACE
              value: "${NAMESPACE}"
            - name: IDLE_THRESHOLD_SECONDS
              value: "${IDLE_THRESHOLD_SECONDS}"
            - name: CONTAINER_MAKER_HOST
              value: "${CONTAINER_MAKER_HOST}"
            - name: CONTAINER_MAKER_PORT
              value: "${CONTAINER_MAKER_PORT}"
            - name: CONTAINER_MAKER_CERTS_SECRET_NAME
              value: "${CONTAINER_MAKER_CERTS_SECRET_NAME}"
            - name: DB_HOST
              value: "${DB_HOST}"
            - name: DB_PORT
              value: "${DB_PORT}"
            - name: DB_USERNAME
              value: "${DB_USERNAME}"
            - name: DB_PASSWORD
              value: "${DB_PASSWORD}"
            - name: DB_DATABASE
              value: "${DB_DATABASE}"
